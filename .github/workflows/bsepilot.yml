# T-Rex · $1 pilot (owner's OK, 16 Nov 2026): read the figures of 10 BSE-only companies' results PDFs and check every number
# on its page. Since 17 Nov 2026 every 2 hours for every BSE-only results PDF (owner's OK). Caps: TREX_BSEPILOT_BUDGET_USD in total,
# TREX_BSEPDF_MONTH_USD per month, both counted by T-Rex across all runs.
# Reader v3 (18 Nov 2026): a table that is a picture, or a poor scan, is read again by OCR (free) as one more witness of what is
# printed; totals must add up to rounding. Figures go to T-Rex only; this public log shows no company names or numbers.
name: T-Rex BSE-only PDF pilot
on:
  schedule:
    - cron: "41 * * * *"       # every hour (18 Nov 2026: of the "every 2 hours" runs GitHub really started only 3 in 36 hours; a run with nothing to read costs nothing). New PDFs come from BSE's feed (T-Rex, every 20 min)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trex-bsepilot
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PDF and OCR tools
        run: for i in 1 2 3; do sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-osd >/dev/null 2>&1 && break; sudo apt-get update -qq || true; sleep 20; done; command -v pdftotext && command -v tesseract
      - name: Read the results PDFs (caps below)
        run: node collector/bsepilot.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.RESEARCH }}
          TREX_KEY: ${{ secrets.TREX_KEY }}
          TREX_BSEPILOT_BUDGET_USD: "25"   # never more than this in total (about $0.0015 a PDF; ≈ $4–6 a results season)
          TREX_BSEPDF_MONTH_USD: "6"       # and never more than this in one month
          TREX_BSEPILOT_N: "60"
          TREX_BSEPILOT_MINUTES: "22"      # no new PDF is started after this many minutes (the job has 30); the rest waits for the next run
