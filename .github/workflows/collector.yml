# T-Rex collector: every 2 hours GitHub downloads new NSE results filings and hands them to T-Rex.
# Secrets (Settings → Secrets and variables → Actions): TREX_KEY = your T-Rex sync secret;
# optional GEMINI_KEY = free Google AI Studio key (reads investor presentations; Cloudflare AI is the backup).
name: T-Rex collector
on:
  schedule:
    - cron: "23 */2 * * *"      # every 2 hours (UTC) — a backup start: GitHub often starts scheduled runs hours late, so each run also starts the next one
  workflow_dispatch:            # "Run workflow" button for a manual run
permissions:
  contents: write      # only to publish the public market-data copy to the gh-pages branch of this repository
  actions: write       # to start the next run 2 hours after this one started
concurrency:
  group: trex-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - name: Note the start time
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PDF text tool (for reading company presentations)
        run: for i in 1 2 3; do sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 && break; sudo apt-get update -qq || true; sleep 20; done; command -v pdftotext   # retried: GitHub's package mirror sometimes fails
      - name: World watch (trade routes, disasters, air traffic, news — public data, no AI)
        run: node collector/world.mjs
        timeout-minutes: 6
        env:
          TREX_KEY: ${{ secrets.TREX_KEY }}
      - name: Collect NSE filings for T-Rex
        if: always()
        run: node collector/collect.mjs
        env:
          TREX_KEY: ${{ secrets.TREX_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}   # optional second Gemini key: used when the first one's limit is reached
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.RESEARCH }}   # optional: your Claude API key — read watchlist documents with Claude first
          TREX_MAX_MINUTES: "23"
          TREX_MONTH_MINUTES: "100000"   # public repository: GitHub minutes are free and unlimited
          TREX_PUBLIC_LOG: "1"           # logs are public: hide watchlist company names
      - name: Publish the market-data copy (GitHub mirror, gh-pages branch)
        if: always()
        run: node collector/mirror.mjs
        env:
          TREX_KEY: ${{ secrets.TREX_KEY }}
          DATA_KEY: ${{ secrets.DATA_KEY }}      # optional: when set, the files on GitHub are stored encrypted
          GITHUB_TOKEN: ${{ github.token }}
          TREX_MIRROR_MINUTES: "12"
      - name: Start the next run 2 hours after this one started (GitHub's own timer is unreliable)
        if: always()
        run: |
          w=$(( 7200 - ( $(date +%s) - T0 ) )); if [ "$w" -gt 0 ]; then echo "Waiting $((w/60)) minutes"; sleep "$w"; fi
          for i in 1 2 3 4 5; do gh workflow run collector.yml --ref main --repo "$GITHUB_REPOSITORY" && break; echo "GitHub did not accept the start — trying again in 60 s"; sleep 60; done; echo "Next run started."
        env:
          GH_TOKEN: ${{ github.token }}
