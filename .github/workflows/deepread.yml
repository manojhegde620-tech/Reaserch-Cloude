# T-Rex one-time deep reading of EVERY listed company with your Claude API key (secret ANTHROPIC_API_KEY).
# Reads each company's latest annual report, investor presentation and earnings-call transcript once, checks every number
# and quote on its page, and saves one file per company in the "deep-data" branch (shown in the app's Business · AI tab).
# Stops by itself when every company is done, when the key ends, or when TREX_CLAUDE_BUDGET_USD is spent.
name: T-Rex deep reading
on:
  schedule:
    - cron: "53 * * * *"        # every hour (UTC); each run reads for ~45 min, then the next one carries on
  workflow_dispatch:
permissions:
  contents: write      # to save the results in the deep-data branch of this repository
  actions: write       # to start the next reading run straight away while companies remain
concurrency:
  group: trex-deep
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PDF text tool
        run: for i in 1 2 3; do sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 && break; sudo apt-get update -qq || true; sleep 20; done; command -v pdftotext   # retried: GitHub's package mirror sometimes fails
      - name: Read company documents with Claude
        run: node collector/deepread.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.RESEARCH }}
          TREX_KEY: ${{ secrets.TREX_KEY }}
          DATA_KEY: ${{ secrets.DATA_KEY }}      # optional: when set, the files on GitHub are stored encrypted
          GITHUB_TOKEN: ${{ github.token }}
          TREX_DEEP_MINUTES: "45"
          TREX_DEEP_PARALLEL: "6"         # companies read at the same time
          TREX_CLAUDE_BUDGET_USD: "155"   # never spend more than this in total (the Ultra plan includes $200 of API credit a month)
          TREX_DEEP2_BUDGET_USD: "75"     # second reading of midcaps + smallcaps (Nov 2026): never more than this
          TREX_DEEP2_RANKS: "101-1000"    # SEBI-style rank by market value: 101-250 midcaps, 251-1000 smallcaps
          TREX_PUBLIC_LOG: "1"
      - name: Start the next run if companies remain
        if: always()
        run: if [ "${{ job.status }}" != "success" ]; then echo "This run failed (GitHub trouble?) - trying again in 15 minutes."; sleep 900; touch /tmp/trex-deep-more; fi; if [ -f /tmp/trex-deep-more ]; then if [ -f /tmp/trex-deep-wait ]; then echo "Nothing got done this run (NSE or Claude busy) - waiting 15 minutes."; sleep 900; fi; for i in 1 2 3 4 5; do gh workflow run deepread.yml --ref main --repo "$GITHUB_REPOSITORY" && break; echo "GitHub did not accept the start — trying again in 60 s"; sleep 60; done; echo "Next run started."; else echo "Nothing more to read right now."; fi
        env:
          GH_TOKEN: ${{ github.token }}
