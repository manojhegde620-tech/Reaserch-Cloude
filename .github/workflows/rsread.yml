# T-Rex · restated quarters of restructured companies (owner's option B, 18 Nov 2026). Only for filings T-Rex flags as a
# restructuring (demerger / merger: discontinued operations, or the notes say so) — a handful a season. The company's own
# Results PDF on NSE is read; every number must be on its own row and the totals must add up, and the statement's current
# quarter must equal the NSE filing. Caps: TREX_RS_BUDGET_USD in total, TREX_RS_MONTH_USD a month, counted by T-Rex.
# Figures go to T-Rex only; this public log shows no company names or numbers.
name: T-Rex restated quarters
on:
  schedule:
    - cron: "17 */3 * * *"     # every 3 hours; T-Rex lists only flagged filings still missing their restated quarters
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trex-rsread
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PDF and OCR tools
        run: for i in 1 2 3; do sudo apt-get install -y -qq poppler-utils tesseract-ocr >/dev/null 2>&1 && break; sudo apt-get update -qq || true; sleep 20; done; command -v pdftotext && command -v pdfseparate && command -v pdfunite
      - name: Read the restated quarters (caps below)
        run: node collector/rsread.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.RESEARCH }}
          TREX_KEY: ${{ secrets.TREX_KEY }}
          TREX_RS_BUDGET_USD: "3"     # never more than this in total (about 1 cent a Results PDF)
          TREX_RS_MONTH_USD: "1"      # and never more than this in one month
          TREX_RS_N: "20"
